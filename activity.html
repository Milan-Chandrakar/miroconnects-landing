<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' https://api.miconnects.in; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="tracker/live.css?v=20261005brand1">
  <title>MiConnects | My activity</title>
  <link rel="icon" href="tracker/assets/logo.png">
  <link rel="stylesheet" href="tracker/styles.css?v=20261005brand1">

<body>
  <a class="skip-link" href="#workspace">Skip to tracker</a>
  <div class="review-bar">
    <span class="review-label">MY JOBS & ACTIVITY</span>
    <nav class="concepts" aria-label="Tracker view">
      <a href="?view=board" data-concept="board"><span>01</span> Pipeline</a>
